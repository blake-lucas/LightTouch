<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The disc's colour, top to bottom. Drawn past the edges: Android's background layer is half as big again. -->
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62D6C0"/>
      <stop offset="1" stop-color="#0E7A6B"/>
    </linearGradient>
  </defs>
  <rect x="-512" y="-512" width="2048" height="2048" fill="url(#teal)"/>
</svg>
