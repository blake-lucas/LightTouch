# One build for the LightTouch desktop app on Linux, Windows and macOS: `cargo build --release`.
# See docs/DESKTOP.md for the layout and how to build, run and package it.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.12"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/blake-lucas/LightTouch"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
