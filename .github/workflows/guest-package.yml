name: Guest packages

# Builds the guest tools packages (armv6.itpack, armv7.itpack) and the full guest-tools set the apps bundle (the
# packages plus the helpers firmwarekit installs when it prepares an IPSW: contrib/export-guest-artifacts.sh's
# ipad-guest-tools, artifact "guest-tools") from blake-lucas/qemu-ios on a GitHub macOS runner, so a release doesn't
# need the development Mac. Runs when ci/guest-package-engine (the engine commit to build) or this
# file changes, or by hand. The packages are the run's artifact; scripts/build-release.sh takes them through
# LT_GUEST_TOOLS.

on:
  push:
    paths:
      - .github/workflows/guest-package.yml
      - ci/guest-package-engine
  workflow_dispatch:
    inputs:
      engine_ref:
        description: Engine commit, branch or tag (default ci/guest-package-engine)
        required: false

permissions:
  contents: read

concurrency:
  group: guest-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guest-package:
    # Xcode 27.1's linker emits no lazy binds, which the legacy iOS link rewrite needs (Un1box's finding).
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Pick the engine commit
        env:
          INPUT_REF: ${{ inputs.engine_ref }}
        run: |
          ref="$INPUT_REF"
          [ -n "$ref" ] || ref=$(tr -d ' \n' < ci/guest-package-engine)
          echo "ENGINE_REF=$ref" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: blake-lucas/qemu-ios
          ref: ${{ env.ENGINE_REF }}
          path: qemu-ios
          fetch-depth: 1

      - name: Restore the iOS 3.1.3 and 3.2 SDK archives
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/guest-sdk-archives
          key: guest-sdk-archives-7ccc15923bc9be1a-2098e67e2a026abf

      - name: Download and verify the SDKs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guest-sdk-archives" "$RUNNER_TEMP/guest-sdks"
          SDK31="$RUNNER_TEMP/guest-sdk-archives/iPhoneOS3.1.3.sdk.tbz2"
          SDK32="$RUNNER_TEMP/guest-sdk-archives/iPhoneOS3.2.sdk.tbz2"
          [ -s "$SDK31" ] || gh api -H 'Accept: application/vnd.github.raw' \
            /repos/qianjigui/iOS-sdks/git/blobs/030f5aab50534fb8b0cd1d5764810cb7424b721c > "$SDK31"
          [ -s "$SDK32" ] || gh api -H 'Accept: application/vnd.github.raw' \
            /repos/qianjigui/iOS-sdks/git/blobs/8cb07f5a5fa988e27bc4f55e795000c36ffa8b1a > "$SDK32"
          echo "7ccc15923bc9be1a4bd234a41bac38f3fea088f1d83a3b18163b4251dccaedd5  $SDK31" | shasum -a 256 -c -
          echo "2098e67e2a026abf238fb2ff4bb990871b0286b717590854b4c4ad566e6d5be3  $SDK32" | shasum -a 256 -c -
          tar -xjf "$SDK31" -C "$RUNNER_TEMP/guest-sdks"
          tar -xjf "$SDK32" -C "$RUNNER_TEMP/guest-sdks"

      - name: Tools
        run: |
          xcodebuild -version
          command -v ldid >/dev/null || brew install ldid

      - name: Build
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/guest-package"
          if ! ARMV6_SDK="$RUNNER_TEMP/guest-sdks/iPhoneOS3.1.3.sdk" IPAD_SDK="$RUNNER_TEMP/guest-sdks/iPhoneOS3.2.sdk" \
               bash qemu-ios/contrib/guest-package/build.sh "$OUT" > "$RUNNER_TEMP/guest-package.log" 2>&1; then
            tail -200 "$RUNNER_TEMP/guest-package.log"
            exit 1
          fi
          if grep -q 'guest-package: warning:' "$RUNNER_TEMP/guest-package.log"; then
            cat "$RUNNER_TEMP/guest-package.log"
            echo '::error::the guest package build warned; not uploading partial packages'
            exit 1
          fi
          test -s "$OUT/armv6.itpack" && test -s "$OUT/armv7.itpack"
          cp qemu-ios/contrib/guest-package/VERSION "$OUT/VERSION"
          echo "$ENGINE_REF" > "$OUT/ENGINE"
          (cd "$OUT" && shasum -a 256 armv6.itpack armv7.itpack | tee SHA256SUMS)

      - name: Export the full guest-tools set
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/guest-export"
          if ! ARMV6_SDK="$RUNNER_TEMP/guest-sdks/iPhoneOS3.1.3.sdk" IPAD_SDK="$RUNNER_TEMP/guest-sdks/iPhoneOS3.2.sdk" \
               bash qemu-ios/contrib/export-guest-artifacts.sh "$OUT" > "$RUNNER_TEMP/guest-export.log" 2>&1; then
            tail -200 "$RUNNER_TEMP/guest-export.log"
            exit 1
          fi
          T="$OUT/ipad-guest-tools"
          test -s "$T/armv6.itpack" && test -s "$T/armv7.itpack" && test -s "$T/it_seal"
          cp qemu-ios/contrib/guest-package/VERSION "$T/VERSION"
          echo "$ENGINE_REF" > "$T/ENGINE"
          cp "$OUT/manifest.json" "$T/manifest.json"
          ls -la "$T"

      - uses: actions/upload-artifact@v4
        with:
          name: guest-tools
          path: ${{ runner.temp }}/guest-export/ipad-guest-tools
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: guest-packages
          path: |
            ${{ runner.temp }}/guest-package/armv6.itpack
            ${{ runner.temp }}/guest-package/armv7.itpack
            ${{ runner.temp }}/guest-package/SHA256SUMS
            ${{ runner.temp }}/guest-package/VERSION
            ${{ runner.temp }}/guest-package/ENGINE
          if-no-files-found: error
          retention-days: 90

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-package-log
          path: |
            ${{ runner.temp }}/guest-package.log
            ${{ runner.temp }}/guest-export.log
            ${{ runner.temp }}/guest-package/logs/
          if-no-files-found: ignore
          retention-days: 7
