name: Idea
description: Something LightTouch could do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to do, and what gets in the way today.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Android
        - Linux
        - Windows
        - macOS
