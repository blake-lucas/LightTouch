name: Bug report
description: LightTouch itself doesn't work the way it should (starting a device, input, sound, the Store, crashes)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for reporting! The most useful thing you can attach is LightTouch's logs: right after the problem,
        open **Settings › Diagnostics › Export logs** and attach the zip below. LightTouch keeps the logs of the
        current and the previous run only, so export before starting the device or reopening LightTouch more than
        once. If preparing a device failed, use the **Device preparation** form instead.
  - type: input
    id: version
    attributes:
      label: LightTouch version
      description: From Settings › About, or the release you downloaded (for example "v0.0.15").
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Phone or computer, and its OS version
      description: For example "Pixel 9, Android 16" or "Ryzen 7 3700X with an RTX 2080, Windows 11". On Linux, also the distribution and whether it's X11 or Wayland.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Emulated device and iOS version, and whether it's jailbroken
      description: For example "iPod touch 2G, iOS 3.1.3, not jailbroken".
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: >
        What you did, what you expected, and what happened instead. If LightTouch showed an error, paste its text.
        If iOS stopped or LightTouch closed, say what was on screen just before.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen again
      description: If you know them, for example "Start the device, open Settings, turn it sideways".
  - type: dropdown
    id: often
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once so far
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >
        Drag the zip from **Settings › Diagnostics › Export logs** here. It holds LightTouch's and the emulator's
        logs, iOS's console, and a summary of your phone or computer (model, OS, GPU) and devices. It leaves out
        your files, firmware and personal details, and replaces your user folder with `~`; it does include the names
        you gave your devices, so look through it first if that matters to you.
      placeholder: Drop the LightTouch-logs-....zip file here
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots or a short video help most with anything you can see. Please don't attach firmware, IPSWs, boot ROMs, IPAs or other personal data.
