name: Bug report
description: LightTouch itself doesn't work the way it should (preparing a device, starting it, input, sound, the Store)
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: LightTouch version
      description: From Settings › About, or the release you downloaded (for example "v0.0.14").
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Phone or computer, and its OS version
      description: For example "Pixel 10, Android 16" or "Ryzen 7 3700X with an RTX 2080, Windows 11".
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Emulated device and iOS version
      description: For example "iPod touch 2G, iOS 3.1.3".
    validations:
      required: true
  - type: dropdown
    id: jailbreak
    attributes:
      label: Jailbroken?
      description: Whether the device was prepared with Jailbreak on.
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. If LightTouch showed an error, paste its text.
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: How often
      options:
        - Every time
        - Sometimes
        - Once so far
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: >
        Screenshots, or the log from around the problem. Desktop logs are in the `logs` folder of LightTouch's data
        folder (Windows `%LOCALAPPDATA%\LightTouch\App`, Linux `~/.local/share/LightTouch`, macOS
        `~/Library/Application Support/LightTouch`). Please don't attach firmware, boot ROMs or personal data.
