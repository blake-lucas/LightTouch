[package]
name = "lighttouch-model"
description = "The app's state and behaviour, independent of any UI toolkit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lighttouch-catalog = { path = "../lighttouch-catalog" }
lighttouch-core = { path = "../lighttouch-core" }
lighttouch-services = { path = "../lighttouch-services" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
