[package]
name = "lighttouch-catalog"
description = "Firmware catalog, IPSW and boot ROM downloads, guest tools selection"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = "1"
md5 = "0.8"
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
