[package]
name = "lighttouch-core"
description = "Safe wrappers over the shared core: device library, engine runtime, worker protocol, frame sharing"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The guest web proxy's OpenSSL, built from source (see lighttouch-sys).
vendored-openssl = ["lighttouch-sys/vendored-openssl"]

[dependencies]
lighttouch-sys = { path = "../lighttouch-sys" }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_JobObjects"] }
